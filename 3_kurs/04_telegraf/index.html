<template id="p-sharnir" data-title="Layout · Front Orthographic">
  <h2>Шарнир</h2>
  <p>Всеки обект се върти около своя център (<strong>Origin</strong>), оранжевата точка. Центърът на рамото (Ramo_L) е в средата му, затова при <span class="nw"><kbd>R</kbd> <kbd>Y</kbd></span> то се откъсва от гредата.</p>
  <p>Центърът трябва да е в болта (Bolt_L):</p>
  <dl class="map">
    <div><dt>1. Bolt_L</dt><dd>маркирайте го, <span class="nw"><kbd>Shift</kbd> <kbd>S</kbd></span> → <strong>Cursor to Selected</strong></dd></div>
    <div><dt>2. Ramo_L</dt><dd>маркирайте го, <strong>Object → Set Origin → Origin to 3D Cursor</strong></dd></div>
  </dl>
  <h3 class="quiet">Проблем</h3>
  <p>Ако при Set Origin е маркиран болтът, а не рамото, се мести центърът на болта. Проверете кой обект е с оранжев контур (активният, Active).</p>
</template>

<template id="p-veriga" data-title="Outliner · Kula">
  <h2>Верига</h2>
  <p>Детето (<strong>Child</strong>) следва родителя (<strong>Parent</strong>), но може да се движи и само. Маркирайте първо детето, после с <kbd>Shift</kbd> + клик родителя: последният маркиран е активният (Active), по-светлият. После <span class="nw"><kbd>Ctrl</kbd> <kbd>P</kbd></span> → <strong>Object (Keep Transform)</strong>.</p>
  <p>Веригата е от четири нива: <strong>Osnova → Stulb → Greda → Ramo_L и Ramo_D</strong>. Болтовете (Bolt_L, Bolt_D) са помощни и не се рендират, затова ги скрийте с окото в Outliner (Hide in Viewport).</p>
  <h3 class="quiet">Проблем</h3>
  <p>При обърнат ред Greda става дете на рамото. Поправя се с <span class="nw"><kbd>Alt</kbd> <kbd>P</kbd></span> → <strong>Clear Parent</strong>.</p>
  <p>Втори клик на същото място върху активен обект маркира обекта зад него. Кликнете на друго място.</p>
</template>

<template id="p-duma" data-title="Animation · Dope Sheet">
  <h2>Думата</h2>
  <p>Знакът се чете само ако постои, затова всяка поза има два ключа (<strong>Keyframe</strong>):</p>
  <dl class="map">
    <div><dt>Пристигане</dt><dd>знакът пристига за 12 кадъра (Frames)</dd></div>
    <div><dt>Тръгване</dt><dd>след 36 кадъра престой</dd></div>
  </dl>
  <p>Рамото помни ъгъла си спрямо гредата (Greda е негов Parent): когато гредата се завърти, рамената тръгват с нея, без да се разпадат. Ъглите са в азбуката на страницата „Задача“.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Ако една от трите части няма ключ, тя се връща в старата си поза. Маркирайте Greda, Ramo_L и Ramo_D, преди да натиснете <kbd>I</kbd> (Insert Keyframe).</p>
</template>

<template id="p-bevel" data-title="Properties · Modifiers">
  <h2>Форма</h2>
  <p>Всичко по външния вид (модификатори и материали) се прави <strong>преди</strong> копирането на кулата, за да го вземе и копието.</p>
  <p><strong>Bevel</strong> е модификатор (Modifier), който закръгля ръбовете: тънкият ръб хваща светлина и кутията спира да изглежда като кутия.</p>
  <dl class="map">
    <div><dt>Stulb</dt><dd>Add Modifier → Bevel<small>Amount 0.028, Segments 2</small></dd></div>
    <div><dt>Другите части</dt><dd>маркирайте ги, Stulb последен (Active), <span class="nw"><kbd>Ctrl</kbd> <kbd>L</kbd></span> → <strong>Copy Modifiers</strong></dd></div>
    <div><dt>Тънките части</dt><dd>Amount 0.01</dd></div>
    <div><dt>Osnova</dt><dd>Object → Shade Auto Smooth</dd></div>
  </dl>
</template>

<template id="p-material" data-title="Shading · Shader Editor">
  <h2>Материал от снимка</h2>
  <p>От една снимка (<strong>Image Texture</strong>) излизат три неща:</p>
  <dl class="map">
    <div><dt>Цвят</dt><dd>Color → Base Color на Principled BSDF</dd></div>
    <div><dt>Грапавост</dt><dd>снимката → Color Ramp → Roughness<small>светлите места са матови</small></dd></div>
    <div><dt>Релеф</dt><dd>снимката → Bump (Height), Normal → Normal на Principled BSDF</dd></div>
    <div><dt>Ръжда</dt><dd>копие на материала, втори Color Ramp → Base Color<small>от почти черно към червено</small></dd></div>
  </dl>
  <p>Снимките са в папката <code>textures</code>. Довлачете ги от File Browser горе вляво направо в Shader Editor. UV картите са готови в стартовия файл.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Възел (Node), пуснат върху съществуваща връзка (Link), се вмъква в нея и избутва Principled надясно. Добавете възлите първо, после ги свържете.</p>
</template>

<template id="p-pod" data-title="Shading · World">
  <h2>Под и фон</h2>
  <p>Подът и фонът са с <strong>Voronoi Texture</strong>: светъл под с петна и облачен фон като циклорама. Телеграфът стои като декор на сцена.</p>
  <dl class="map">
    <div><dt>Teren</dt><dd>Voronoi Texture → Color Ramp → Base Color<small>Scale 22, Detail 2.3</small></dd></div>
    <div><dt>Фонът (World)</dt><dd>в Shader Editor сменете Object на <strong>World</strong>, Voronoi Texture → Color на Background<small>Scale 4.4, Strength 0.24</small></dd></div>
  </dl>
</template>

<template id="p-svetlina" data-title="Properties · Light">
  <h2>Светлина и камера</h2>
  <p>Топлото слънце (Slunce, Sun) остава. Срещу него добавете цветен <strong>Spot</strong> отгоре вляво.</p>
  <dl class="map">
    <div><dt>Location, Rotation</dt><dd><span class="nw"><kbd>G</kbd> <kbd>X</kbd> −6</span>, <span class="nw"><kbd>G</kbd> <kbd>Z</kbd> 12.6</span>, <span class="nw"><kbd>R</kbd> <kbd>Y</kbd> −30</span></dd></div>
    <div><dt>Spot</dt><dd>Power 10000 W, Angle 55°, Blend 1<small>лилав цвят, Hex D0B9FF</small></dd></div>
    <div><dt>Look</dt><dd>Render Properties → Color Management → Look: <strong>AgX - Very High Contrast</strong></dd></div>
    <div><dt>Kamera</dt><dd>слиза на 1,7 m и гледа леко нагоре<small>кулите стават монументални</small></dd></div>
  </dl>
  <h3 class="quiet">Проблем</h3>
  <p>Снимките са извън файла (.blend) и на друг компютър текстурите (Image Texture) стават розови. <strong>File → External Data → Pack Resources</strong> ги вгражда във файла.</p>
</template>

<template id="p-kula2" data-title="Animation · Dope Sheet">
  <h2>Втора кула</h2>
  <p>Десен клик върху Osnova в Outliner → <strong>Select Hierarchy</strong> маркира цялата кула. <span class="nw"><kbd>Shift</kbd> <kbd>D</kbd></span>, <kbd>X</kbd> 12, Enter. Копието носи свои ключове (Keyframes), същите материали, Bevel и UV Map.</p>
  <p>В Dope Sheet <kbd>A</kbd> маркира ключовете на копието, <kbd>G</kbd> 48 ги отмества с 2 секунди. Втората кула повтаря съобщението като щафета.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Ако копирате и местите само Stulb, при пускане той скача обратно, защото <kbd>I</kbd> е записал и позицията му. Местете Osnova: тя няма ключове.</p>
</template>

<template id="p-har1" data-title="Graph Editor · Ramo_L, Ramo_D">
  <h2>Характер: новата машина</h2>
  <p>Една и съща дума, два характера. Първата кула е пъргава: Ramo_L и Ramo_D закъсняват след Greda и прескачат знака.</p>
  <dl class="map">
    <div><dt>Закъснение</dt><dd>на Frame 12, с мишката над Dope Sheet, <kbd>]</kbd> маркира ключовете след него, <kbd>G</kbd> 3<small>рамената тръгват 3 кадъра по-късно</small></dd></div>
    <div><dt>Back</dt><dd><span class="nw"><kbd>Ctrl</kbd> <kbd>Tab</kbd></span> → Graph Editor, <kbd>A</kbd>, <kbd>T</kbd> → <strong>Back</strong></dd></div>
  </dl>
</template>

<template id="p-har2" data-title="Graph Editor · Modifiers">
  <h2>Характер: старата машина</h2>
  <p>Втората кула е стара и тракаща. Филтърът <strong>Y Euler</strong> оставя само кривата на завъртането. Клик върху ключ я прави активна (Active F-Curve), после в страничната лента (Sidebar, <kbd>N</kbd>) <strong>Modifiers → Add Modifier</strong>.</p>
  <dl class="map">
    <div><dt>Greda</dt><dd>Stepped Interpolation, Step Size 3<small>движи се на стъпки като часовник</small></dd></div>
    <div><dt>Ramo_L, Ramo_D</dt><dd>Noise, Strength 0.3, Scale 1.5<small>треперят с около ±4°</small></dd></div>
  </dl>
  <h3 class="quiet">Проблем</h3>
  <p>Add Modifier е сив, ако няма активна крива: кликнете ключ. Клик върху вече отворения раздел Modifiers скрива Sidebar, а <kbd>N</kbd> я връща.</p>
</template>

<template id="p-render" data-title="Properties · Output">
  <h2>Рендер</h2>
  <dl class="map">
    <div><dt>Output</dt><dd>Media Type Video, MPEG-4, H.264<small>както в задача 03</small></dd></div>
    <div><dt>Render Image</dt><dd><kbd>F12</kbd> рендира един кадър, <kbd>Esc</kbd> връща изгледа</dd></div>
    <div><dt>Render Animation</dt><dd>Render → Render Animation (<span class="nw"><kbd>Ctrl</kbd> <kbd>F12</kbd></span>)<small>384 кадъра, около 2 минути на този компютър</small></dd></div>
  </dl>
  <p>Докато рендира, Blender не реагира.</p>
</template>
