<template id="p-kost" data-title="Layout · Front Orthographic">
  <h2>Арматура и първата кост</h2>
  <p>Ригът е набор от кости, който движи частите на модела, затова анимираме костите, а не самите части. Всяка кост се върти около главата си (<strong>Head</strong>), затова за механизъм главата трябва да е точно в болта, около който се върти частта. Ако главата е встрани от болта, частта се завърта около грешна точка и се разминава с останалите.</p>
</template>
<template id="p-kost1" data-title="Layout · Front Orthographic">
  <h2>Арматура и първата кост</h2>
  <h3 class="quiet">Какво се прави</h3>
  <p>Искаме главата на първата кост да е в шарнира на рамото. В Object Mode избираме Ramo и натискаме <span class="nw"><kbd>Shift</kbd> <kbd>S</kbd></span> → <strong>Cursor to Selected</strong>; 3D курсорът отива в началото на рамото, т.е. в шарнира. После натискаме <span class="nw"><kbd>Shift</kbd> <kbd>A</kbd></span> → <strong>Armature</strong>. Появява се обект Armature с една кост, чиято глава е в курсора и която сочи нагоре по Z. За да виждаме костта през рамото, в Object Data Properties (зелената фигурка) → Viewport Display включваме <strong>Names</strong>, за да се виждат имената на костите, и <strong>In Front</strong>. Влизаме в Edit Mode с <kbd>Tab</kbd>: тук определяме къде стоят костите. Кликваме върху малкия кръг на върха (Tail) и го местим с <kbd>G</kbd> по рамото. Наименуваме костта Ramo с <kbd>F2</kbd>.</p>
</template>
<template id="p-kost2" data-title="Layout · Front Orthographic">
  <h2>Арматура и първата кост</h2>
  <h3 class="quiet">Как се стига до стойността</h3>
  <p>Дължината на костта не влияе на въртенето, защото то е около главата. Затова върхът се поставя там, където ще ни трябва: на болта на пръта. Засега го слагаме приблизително по рамото.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Ако преди <span class="nw"><kbd>Shift</kbd> <kbd>A</kbd></span> курсорът не е в шарнира, арматурата се появява на друго място. Тогава трием арматурата и повтаряме <span class="nw"><kbd>Shift</kbd> <kbd>S</kbd></span> → Cursor to Selected с избрано рамо.</p>
  <p><span class="nw"><kbd>Ctrl</kbd> <kbd>Tab</kbd></span> в Edit Mode не влиза в Pose Mode, а отваря менюто с режимите, затова първо излизаме с <kbd>Tab</kbd>. Ако в Pose Mode <kbd>R</kbd> не прави нищо, костта не е избрана: в Edit Mode беше избран само върхът ѝ.</p>
</template>

<template id="p-kosti" data-title="Layout · Edit Mode">
  <h2>Костите на буталото и на прожектора</h2>
  <p>Всяка подвижна част получава своя кост с глава в своя болт. Прътът и прожекторът са закачени за рамото, затова техните кости стават деца на костта Ramo: когато рамото се завърти, те се движат с него. Цилиндърът е закачен за ремаркето, което не мърда, затова неговата кост няма родител.</p>
</template>

  <h3 class="quiet">Какво се прави</h3>
  <p>Нова кост в Edit Mode се добавя с <span class="nw"><kbd>Shift</kbd> <kbd>A</kbd></span> и главата ѝ е там, където е курсорът. Затова за всяка кост първо слагаме курсора в болта.</p>
  <dl class="map">
    <div><dt>1. Курсорът</dt><dd>излизаме с <kbd>Tab</kbd>, избираме Prut и натискаме <span class="nw"><kbd>Shift</kbd> <kbd>S</kbd></span> → <strong>Cursor to Selected</strong>; курсорът отива в болта на пръта</dd></div>

    <div><dt>3. Новата кост</dt><dd><span class="nw"><kbd>Shift</kbd> <kbd>A</kbd></span>: новата кост излиза от същия болт, наименуваме я Prut с <kbd>F2</kbd> и с <kbd>G</kbd> насочваме върха ѝ приблизително към цилиндъра</dd></div>
    <div><dt>4. Другите две</dt><dd>по същия начин курсорът отива в болта на Tsilindur (кост Tsilindur, насочена към пръта) и в шарнира на Prozhektor (кост Prozhektor, насочена нагоре)</dd></div>
    <div><dt>5. Родителят</dt><dd>избираме Prut, после с <kbd>Shift</kbd> костта Ramo, натискаме <span class="nw"><kbd>Ctrl</kbd> <kbd>P</kbd></span> → <strong>Keep Offset</strong>; повтаряме за Prozhektor → Ramo</dd></div>
  </dl>
</template>
<template id="p-kosti2" data-title="Layout · Edit Mode">
  <h2>Костите на буталото и на прожектора</h2>
  <h3 class="quiet">Как се стига до стойността</h3>
  <p>Главите трябва да са точни, защото около тях става въртенето. Посоката на Prut и Tsilindur може да е приблизителна, защото Damped Track ще ги насочи сам.</p>
  <h3 class="quiet">Проблем</h3>
  <p>При <span class="nw"><kbd>Ctrl</kbd> <kbd>P</kbd></span> последната избрана кост става родител. Ако изберем костите наобратно, Ramo става дете на Prut. Проверяваме в Bone Properties → Relations → Parent.</p>
  <p>Прътът е скрит в цилиндъра, затова го избираме в Outliner. След <span class="nw"><kbd>Shift</kbd> <kbd>A</kbd></span> в Edit Mode новата кост е избрана, но не е активна: преди <kbd>F2</kbd> я избираме с клик.</p>
</template>

<template id="p-chasti" data-title="Layout · Pose Mode">
  <h2>Частите следват костите</h2>
  <p>Досега костите се движат, но частите не. Всяка твърда част трябва да следва изцяло една кост, без да се огъва. Това прави <span class="nw"><kbd>Ctrl</kbd> <kbd>P</kbd></span> → <strong>Bone</strong>: обектът се закача за избраната кост така, както в урок 04 частите се закачаха за друг обект.</p>
</template>
<template id="p-chasti1" data-title="Layout · Pose Mode">
  <h2>Частите следват костите</h2>
  <h3 class="quiet">Какво се прави</h3>
  <p>В Object Mode избираме Ramo, после с <kbd>Shift</kbd> арматурата, и влизаме в Pose Mode с <span class="nw"><kbd>Ctrl</kbd> <kbd>Tab</kbd></span>. Кликваме костта Ramo, за да е активна, и натискаме <span class="nw"><kbd>Ctrl</kbd> <kbd>P</kbd></span> → <strong>Bone</strong>. Връщаме се в Object Mode с <span class="nw"><kbd>Ctrl</kbd> <kbd>Tab</kbd></span> и повтаряме за Tsilindur → кост Tsilindur и Prut → кост Prut. Prozhektor се закача по същия начин за костта Prozhektor; светлината Svetlina вече е негово дете от стартовия файл, затова се движи с него.</p>
</template>
<template id="p-chasti2" data-title="Layout · Pose Mode">
  <h2>Частите следват костите</h2>
  <h3 class="quiet">Как се стига до стойността</h3>
  <p>Коя кост за коя част се вижда от болта: частта следва костта, чиято глава е в нейния болт.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Ако след <span class="nw"><kbd>Ctrl</kbd> <kbd>P</kbd></span> частта скочи на друго място, при закачането не е била избрана Bone, а друга опция (например With Automatic Weights). Отменяме с <span class="nw"><kbd>Ctrl</kbd> <kbd>Z</kbd></span> и повтаряме.</p>
</template>

<template id="p-damped" data-title="Properties · Bone Constraints">
  <h2>Буталото: Damped Track</h2>
  <p>Цилиндърът и прътът трябва да са на една линия при всяко положение на рамото. Вместо да ги въртим на ръка във всеки кадър, даваме на всяка от двете кости ограничение (<strong>Bone Constraint</strong>) <strong>Damped Track</strong>: то завърта костта така, че нейната ос Y (от главата към върха) да сочи към цел.</p>
  <p>Цилиндърът трябва да сочи към болта на пръта, а прътът към болта на цилиндъра. Болтът на пръта е върхът на костта Ramo, затова целта на Tsilindur е Ramo с <strong>Head/Tail</strong> 1, тоест върхът ѝ. Целта на Prut е Tsilindur с Head/Tail 0, тоест главата му.</p>
</template>
<template id="p-damped1" data-title="Properties · Bone Constraints">
  <h2>Буталото: Damped Track</h2>
  <h3 class="quiet">Какво се прави</h3>
  <dl class="map">
    <div><dt>Tsilindur</dt><dd>в Pose Mode избираме костта, в Properties отваряме Bone Constraint Properties → <strong>Add Bone Constraint</strong> → <strong>Damped Track</strong><small>Target: арматурата, Bone: Ramo, Head/Tail: 1</small></dd></div>
    <div><dt>Prut</dt><dd>избираме костта и добавяме Damped Track<small>Target: арматурата, Bone: Tsilindur, Head/Tail: 0</small></dd></div>
  </dl>
</template>
<template id="p-damped2" data-title="Properties · Bone Constraints">
  <h2>Буталото: Damped Track</h2>
  <h3 class="quiet">Как се стига до стойността</h3>
  <p>Head/Tail казва къде по дължината на целевата кост е точката: 0 е главата, 1 е върхът. Избираме я по това къде е болтът, към който трябва да сочи частта.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Ако двете кости гледат една към друга, Blender приема това, но го отбелязва като кръгова зависимост (dependency cycle): за да насочи цилиндъра, трябва първо да знае къде е прътът, а за пръта трябва да знае къде е цилиндърът. Затова тук целта на цилиндъра е върхът на рамото, който не зависи от буталото.</p>
</template>

<template id="p-animacia2" data-title="Layout · Timeline">
  <h2>Анимация</h2>
  <h3 class="quiet">Как се стига до стойността</h3>
  <p>90° идва от двете положения на рамото: от хоризонтално до вертикално. Ако при <span class="nw"><kbd>R</kbd> 90</span> рамото се завърти надолу към ремаркето, посоката е обратна и пишем −90. Наклонът на прожектора се избира по това къде на пода трябва да падне светлината.</p>
  <h3 class="quiet">Проблем</h3>
  <p>Damped Track върти костите, но не променя дължините им. Ако рамото отиде под хоризонталата, прътът минава през дъното на цилиндъра, а ако отиде много след вертикалата, прътът излиза от него. Затова рамото се анимира между 0° и 90°.</p>
  <p>Клавишите отиват към областта под мишката: след като напишем кадъра в Timeline, връщаме мишката над 3D изгледа, преди да натиснем <kbd>R</kbd> или <kbd>I</kbd>.</p>
</template>

  <h2>Задача: Rigging</h2>
  <p>Ригваме мобилна осветителна кула и я анимираме: рамото се вдига от положението за превоз, а прожекторът се насочва към точка на сцената.</p>
  <table>
    <thead><tr><th>#</th><th>Елемент</th><th>Техника</th><th>Какво трябва да се случи</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Кост Ramo</td><td>Shift A → Armature, Shift S</td><td>главата е в шарнира; рамото се върти около него</td></tr>
      <tr><td>2</td><td>Кости Prut, Tsilindur, Prozhektor</td><td>Shift A в Edit Mode, Ctrl P → Keep Offset</td><td>главите са в болтовете; Prut и Prozhektor следват Ramo</td></tr>
      <tr><td>3</td><td>Частите</td><td>Ctrl P → Bone</td><td>всяка част следва своята кост; светлината следва прожектора</td></tr>
      <tr><td>4</td><td>Буталото</td><td>Damped Track</td><td>цилиндърът и прътът са на една линия при всеки ъгъл</td></tr>
      <tr><td>5</td><td>Анимацията</td><td>I, R</td><td>рамото се вдига от 0° до 90°, после прожекторът се накланя</td></tr>
    </tbody>
  </table>
  <h3>За вдъхновение</h3>
  <p>László Moholy-Nagy, „Light Prop for an Electric Stage“ (1930): механична скулптура с мотор, движещи се метални части и светлина, замислена като апарат за сцена. <a href="https://harvardartmuseums.org/article/em-light-prop-for-an-electric-stage-em-past-and-present" target="_blank" rel="noopener">harvardartmuseums.org</a></p>
  <h3>Допълнително за бързите</h3>
  <p>Телескопично рамо. Добавяме втора част, която излиза от горния край на рамото: кост, дете на Ramo, която се анимира с <kbd>G</kbd> по оста на рамото, а прожекторът се закача за нея.</p>
